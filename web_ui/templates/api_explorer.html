<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roche_nxt API Explorer</title>
<style>
:root {
  --bg:#0f1117; --surface:#161b27; --surface2:#1e2535; --border:#2a3348;
  --text:#e2e8f0; --muted:#64748b; --accent:#4f8ef7; --green:#22c55e;
  --red:#ef4444; --yellow:#f59e0b; --orange:#f97316; --purple:#a78bfa;
  --cyan:#06b6d4; --radius:6px; --font-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Topbar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:100}
.topbar-brand{font-weight:700;font-size:1rem;color:var(--text);white-space:nowrap}
.topbar-brand span{color:var(--accent)}
.topbar-badge{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:2px 8px;border-radius:20px}
.topbar-spacer{flex:1}
.cfg-row{display:flex;gap:8px;align-items:center}
.cfg-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:var(--radius);font-size:.78rem;outline:none;min-width:160px}
.cfg-input:focus{border-color:var(--accent)}
.cfg-input::placeholder{color:var(--muted)}
.btn{padding:5px 12px;border-radius:var(--radius);border:none;cursor:pointer;font-size:.78rem;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:3px 9px;font-size:.72rem}

/* ── Layout ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:350px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-search{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
.sidebar-search input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:var(--radius);font-size:.78rem;outline:none}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-list{flex:1;overflow-y:auto;padding:8px 0}
.cat-label{padding:8px 14px 4px;font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ep-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.ep-item:hover{background:var(--surface2)}
.ep-item.active{background:var(--surface2);border-left-color:var(--accent)}
.ep-item .method-badge{font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:3px;width:38px;text-align:center;flex-shrink:0;font-family:var(--font-mono)}
.m-GET{background:#1a3a2e;color:var(--green)}
.m-POST{background:#1a2a4a;color:var(--accent)}
.m-PUT{background:#3a2a10;color:var(--yellow)}
.m-DELETE{background:#3a1010;color:var(--red)}
.ep-path{font-size:.73rem;color:var(--text);font-family:var(--font-mono);word-break:break-all;line-height:1.4}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Tabs ── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.tab-btn{padding:10px 18px;font-size:.78rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.tab-panels{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{display:none;flex:1;overflow:hidden}
.tab-panel.active{display:flex;flex-direction:column}
#tryPanel,#codePanel{overflow-y:auto;padding:24px;gap:20px}

/* ── Doc Panel ── */
.ep-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ep-method{font-size:.85rem;font-weight:700;font-family:var(--font-mono);padding:3px 10px;border-radius:var(--radius)}
.ep-url{font-size:1rem;font-family:var(--font-mono);color:var(--text);font-weight:500}
.ep-desc{color:var(--muted);line-height:1.6;font-size:.82rem}
.section-title{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.param-table{width:100%;border-collapse:collapse}
.param-table th{text-align:left;padding:6px 10px;font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
.param-table td{padding:7px 10px;font-size:.78rem;border-bottom:1px solid var(--border)}
.param-table tr:last-child td{border-bottom:none}
.param-name{font-family:var(--font-mono);color:var(--cyan)}
.param-type{font-family:var(--font-mono);color:var(--purple);font-size:.72rem}
.param-req{color:var(--red);font-size:.7rem;font-weight:700}
.param-opt{color:var(--muted);font-size:.7rem}

/* ── Code Block ── */
.code-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);font-size:.7rem;color:var(--muted)}
.code-body{padding:14px;font-family:var(--font-mono);font-size:.78rem;line-height:1.6;overflow-x:auto;white-space:pre}
.copy-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer;font-size:.68rem}
.copy-btn:hover{color:var(--text)}

/* ── Try It Out ── */
.try-section{display:flex;flex-direction:column;gap:16px}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:.75rem;color:var(--muted);font-weight:500}
.form-label .req{color:var(--red);margin-left:3px}
.form-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius);font-size:.82rem;font-family:var(--font-mono);outline:none;width:100%}
.form-input:focus{border-color:var(--accent)}
.form-textarea{min-height:120px;resize:vertical}
.exec-row{display:flex;gap:8px;align-items:center}
.request-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.request-label{background:var(--surface);padding:6px 12px;font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
.request-body{padding:12px;font-family:var(--font-mono);font-size:.75rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto}
.response-area{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.response-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.status-badge{font-family:var(--font-mono);font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:3px}
.status-2xx{background:#1a3a2e;color:var(--green)}
.status-4xx{background:#3a2210;color:var(--orange)}
.status-5xx{background:#3a1010;color:var(--red)}
.status-0{background:var(--surface2);color:var(--muted)}
.response-time{font-size:.72rem;color:var(--muted)}
.response-body{padding:14px;font-family:var(--font-mono);font-size:.76rem;line-height:1.6;white-space:pre-wrap;max-height:340px;overflow-y:auto}

/* ── JSON colors ── */
.json-key{color:#7dd3fc}
.json-str{color:#86efac}
.json-num{color:#fda4af}
.json-bool{color:#c4b5fd}
.json-null{color:var(--muted)}

/* ── Welcome ── */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:40px}
.welcome h2{font-size:1.1rem;color:var(--text);font-weight:600}

/* ── Auth status ── */
.auth-status{font-size:.72rem;display:flex;align-items:center;gap:5px}
.auth-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.auth-dot.ok{background:var(--green)}

/* ── History ── */
.history-panel{width:220px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.history-title{padding:10px 12px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.history-list{flex:1;overflow-y:auto}
.history-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.history-item:hover{background:var(--surface2)}
.history-item .hi-method{font-family:var(--font-mono);font-size:.65rem;font-weight:700}
.history-item .hi-path{font-size:.72rem;font-family:var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.history-item .hi-status{font-size:.68rem;font-weight:700}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.65rem;font-weight:600;margin-left:4px}
.tag-auth{background:#1a2a4a;color:var(--accent)}
.tag-ext{background:#1a3a2e;color:var(--green)}

/* ── Doc layout ── */
.doc-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.doc-header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.doc-path{font-family:var(--font-mono);font-size:.9rem;color:var(--text);background:var(--surface2);padding:3px 10px;border-radius:var(--radius);border:1px solid var(--border)}
.doc-summary{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:8px}
.doc-desc{font-size:.8rem;color:var(--muted);line-height:1.7;white-space:pre-wrap;font-family:inherit;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:4px}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;overflow:hidden}
.doc-col-left{padding:20px 20px 20px 24px;overflow-y:auto;border-right:1px solid var(--border)}
.doc-col-right{padding:20px 24px 20px 20px;overflow-y:auto}

.doc-section{margin-bottom:24px}
.doc-section:last-child{margin-bottom:0}
.doc-section-title{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

.param-table{width:100%;border-collapse:collapse;font-size:.78rem}
.param-table thead tr{background:var(--surface2)}
.param-table th{text-align:left;padding:7px 10px;font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--border)}
.param-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.param-table tbody tr:last-child td{border-bottom:none}
.param-table tbody tr:hover{background:var(--surface2)}
.param-name{font-family:var(--font-mono);color:var(--cyan);font-size:.8rem}
.param-type{font-family:var(--font-mono);color:var(--purple);font-size:.72rem;background:rgba(167,139,250,.1);padding:1px 5px;border-radius:3px}
.param-req{color:var(--red);font-size:.68rem;font-weight:700;background:rgba(239,68,68,.1);padding:1px 5px;border-radius:3px}
.param-opt{color:var(--muted);font-size:.68rem;background:var(--surface2);padding:1px 5px;border-radius:3px}
.param-desc{color:var(--muted);font-size:.78rem;line-height:1.5}
</style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="topbar">
  <div class="topbar-brand">Roche<span>_nxt</span> API Explorer</div>
  <div class="topbar-badge">v{{ app_version or '1.0.0' }}</div>
  <div class="topbar-spacer"></div>
  <div class="cfg-row">
    <div class="auth-status"><div class="auth-dot" id="authDot"></div><span id="authLabel">미인증</span></div>
    <input class="cfg-input" id="cfgUrl" placeholder="http://server:8080" style="width:200px" oninput="updateBaseUrl()">
    <input class="cfg-input" id="cfgKey" placeholder="API Key (rnxt-...)" style="width:200px" type="password" oninput="updateApiKey()">
    <button class="btn btn-ghost btn-sm" onclick="toggleKeyVisibility()">👁</button>
    <button class="btn btn-green btn-sm" onclick="window.location='/api/developer/download/roche_client'" title="Python CLI 클라이언트 다운로드">⬇ roche_client.py</button>
    <button class="btn btn-primary btn-sm" onclick="openLoginModal()">로그인</button>
    <button class="btn btn-ghost btn-sm" onclick="checkAuth()">확인</button>
  </div>
</div>

<!-- ── Layout ── -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input id="epSearch" placeholder="엔드포인트 검색..." oninput="filterEndpoints(this.value)">
    </div>
    <div class="sidebar-list" id="epList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="tab-bar" id="tabBar" style="display:none">
      <div class="tab-btn active" onclick="switchTab('doc',this)">문서</div>
      <div class="tab-btn" onclick="switchTab('try',this)">Try it out</div>
      <div class="tab-btn" onclick="switchTab('code',this)">코드 예시</div>
    </div>
    <div class="tab-panels">
      <!-- Welcome -->
      <div id="welcomePanel" class="tab-panel active" style="align-items:center;justify-content:center">
        <div class="welcome">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#2a3348"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <h2>Roche_nxt API Explorer</h2>
          <p>왼쪽 목록에서 엔드포인트를 선택하세요.</p>
          <p>상단에서 서버 URL과 API Key를 설정하면<br>실제 API를 바로 테스트할 수 있습니다.</p>
        </div>
      </div>
      <!-- Doc -->
      <div id="docPanel" class="tab-panel" style="display:none"></div>
      <!-- Try -->
      <div id="tryPanel" class="tab-panel" style="display:none"></div>
      <!-- Code -->
      <div id="codePanel" class="tab-panel" style="display:none"></div>
    </div>
  </div>

  <!-- History -->
  <div class="history-panel">
    <div class="history-title">요청 히스토리</div>
    <div class="history-list" id="historyList">
      <div style="padding:16px 12px;color:var(--muted);font-size:.75rem">요청 내역이 없습니다.</div>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;width:340px">
    <div style="font-size:.95rem;font-weight:700;margin-bottom:18px">로그인</div>
    <div class="form-row" style="margin-bottom:12px">
      <label class="form-label">사용자 ID</label>
      <input class="form-input" id="loginUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-row" style="margin-bottom:18px">
      <label class="form-label">비밀번호</label>
      <input class="form-input" id="loginPw" type="password" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="loginErr" style="color:var(--red);font-size:.78rem;margin-bottom:10px;display:none"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeLoginModal()">취소</button>
      <button class="btn btn-primary" onclick="doLogin()">로그인 & API Key 저장</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let BASE_URL = window.location.origin;
let API_KEY  = '';
let currentEp = null;
let requestHistory = [];

document.getElementById('cfgUrl').value = BASE_URL;

// ── API definitions ────────────────────────────────────────────────────────────
const ENDPOINTS = [
  // ── Authentication ─────────────────────────────────────────────────────────
  { cat:'인증 (Authentication)', method:'POST', path:'/api/auth/login',
    summary:'로그인',
    desc:'사용자 ID와 비밀번호로 로그인합니다. 세션 쿠키가 발급됩니다.\n외부 프로그램은 이 엔드포인트는 사용하지 않고 API Key를 사용하세요.',
    noAuth: true,
    body: { user_id:'admin', password:'your_password' },
    bodySchema: [
      { name:'user_id', type:'string', req:true, desc:'사용자 ID' },
      { name:'password', type:'string', req:true, desc:'비밀번호' },
    ],
    response200: { success:true, user_id:'admin', role:'admin' },
    response401: { success:false, error:'아이디 또는 비밀번호가 올바르지 않습니다.' },
  },
  { cat:'인증 (Authentication)', method:'POST', path:'/api/auth/logout',
    summary:'로그아웃', desc:'현재 세션을 종료합니다.',
    response200: { success:true },
  },
  { cat:'인증 (Authentication)', method:'GET', path:'/api/auth/me',
    summary:'현재 사용자 정보', noAuth:true,
    desc:'현재 로그인된 사용자 정보를 반환합니다.',
    response200: { authenticated:true, user_id:'admin', role:'admin' },
  },
  { cat:'인증 (Authentication)', method:'GET', path:'/api/auth/api_key',
    summary:'API Key 조회', tag:'ext',
    desc:'외부 프로그램 연동에 사용할 API Key를 반환합니다.\n처음 호출 시 자동으로 생성됩니다.\n\n요청 헤더에 아래 중 하나를 포함하세요:\n  X-Api-Key: rnxt-xxxx\n  Authorization: Bearer rnxt-xxxx',
    response200: { api_key:'rnxt-3f2a1b4cxxxxxxxxxxxxxxxx' },
  },
  { cat:'인증 (Authentication)', method:'POST', path:'/api/auth/api_key/regenerate',
    summary:'API Key 재발급', tag:'ext',
    desc:'새 API Key를 발급합니다. 기존 키는 즉시 무효화됩니다.',
    response200: { api_key:'rnxt-newkeyxxxxxxxxxxxxxxxx' },
  },

  // ── Orders ────────────────────────────────────────────────────────────────
  { cat:'오더 (Orders)', method:'GET', path:'/api/orders',
    summary:'Order 목록 조회',
    desc:'전체 Order 목록을 반환합니다. 최신 생성 순으로 정렬됩니다.',
    response200: [
      { id:'20260628110000-abc123', order_name:'SAMPLE-001', sample_name:'SAMPLE-001',
        status:'completed', reference:'hg38', created_at:'2026-06-28T11:00:00' },
    ],
  },
  { cat:'오더 (Orders)', method:'POST', path:'/api/orders',
    summary:'Order 생성', tag:'ext',
    desc:'새 Order를 생성합니다. 분석은 자동으로 시작되지 않으며,\n/start 또는 /report_status 를 별도로 호출해야 합니다.',
    body: {
      sample_name:'SAMPLE-001', r1_fastq:'SAMPLE-001_R1.fastq.gz', r2_fastq:'SAMPLE-001_R2.fastq.gz',
      bed_file:'SNUH_bed/coords.cons.bed', reference:'hg38', af_threshold:0.005,
      use_umi:'Y', order_name:'2026-06-28 SAMPLE-001', patient_name:'홍길동',
      chart_number:'12345678', department:'혈액종양내과', doctor_name:'김교수',
    },
    bodySchema: [
      { name:'sample_name', type:'string', req:true, desc:'샘플 ID' },
      { name:'r1_fastq',    type:'string', req:true, desc:'R1 FASTQ 파일명 (FASTQ 디렉토리 기준 상대경로)' },
      { name:'r2_fastq',    type:'string', req:true, desc:'R2 FASTQ 파일명' },
      { name:'bed_file',    type:'string', req:false, desc:'BED 파일 경로 (BED 디렉토리 기준 상대경로)' },
      { name:'reference',   type:'string', req:false, desc:'"hg38" 또는 "hg19" (기본: hg38)' },
      { name:'af_threshold',type:'number', req:false, desc:'Allele Frequency 임계값 (기본: 0.005)' },
      { name:'use_umi',     type:'string', req:false, desc:'"Y", "N", "" 중 하나 (기본: 전역 설정)' },

// ── Render sidebar ─────────────────────────────────────────────────────────────
function buildSidebar(eps) {
  const list = document.getElementById('epList');
  list.innerHTML = '';
  let lastCat = '';
  eps.forEach((ep, idx) => {
    if (ep.cat !== lastCat) {
      lastCat = ep.cat;
      const label = document.createElement('div');
      label.className = 'cat-label';
      label.textContent = ep.cat;
      list.appendChild(label);
    }
    const item = document.createElement('div');
    item.className = 'ep-item';
    item.dataset.idx = idx;
    item.onclick = () => selectEp(idx);
    const badge = document.createElement('div');
    badge.className = `method-badge m-${ep.method}`;
    badge.textContent = ep.method;
    const path = document.createElement('div');
    path.className = 'ep-path';
    path.title = ep.path;
    path.textContent = ep.path;
    item.appendChild(badge);
    item.appendChild(path);
    list.appendChild(item);
  });
}

function filterEndpoints(q) {
  const items = document.querySelectorAll('.ep-item');
  const labels = document.querySelectorAll('.cat-label');
  q = q.toLowerCase();
  items.forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const ep = ENDPOINTS[idx];
    const match = !q || ep.path.toLowerCase().includes(q) || ep.summary.toLowerCase().includes(q) || ep.method.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
  });
  // hide empty categories
  labels.forEach(lbl => {
    let next = lbl.nextElementSibling;
    let hasVisible = false;
    while (next && !next.classList.contains('cat-label')) {
      if (next.style.display !== 'none') hasVisible = true;
      next = next.nextElementSibling;
    }
    lbl.style.display = hasVisible ? '' : 'none';
  });
}

// ── Select endpoint ────────────────────────────────────────────────────────────
function selectEp(idx) {
  currentEp = ENDPOINTS[idx];
  document.querySelectorAll('.ep-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });
  document.getElementById('welcomePanel').style.display = 'none';
  document.getElementById('tabBar').style.display = '';
  renderDoc(currentEp);
  renderTry(currentEp);
  renderCode(currentEp);
  switchTab('doc', document.querySelector('.tab-btn'));
}

function switchTab(tab, btn) {
  ['doc','try','code'].forEach(t => {
    const p = document.getElementById(t+'Panel');
    if(p) {
      if(t === tab) {
        p.style.display = 'flex';
        p.style.flexDirection = 'column';
        p.style.gap = '0';
      } else {
        p.style.display = 'none';
      }
    }
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function executeRequest() {
  const ep = currentEp;
  if(!ep) return;
  const base = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
  const key  = document.getElementById('cfgKey').value.trim();

  let url = base + ep.path;
  if(ep.pathParams) {
    ep.pathParams.forEach(p => {
      const val = (document.getElementById('pp_'+p.name)||{}).value||'';
      url = url.replace('{'+p.name+'}', val.trim());
    });
  }

  const headers = { 'Content-Type':'application/json' };
  if(key) headers['X-Api-Key'] = key;

  let body = undefined;
  const bodyEl = document.getElementById('tryBody');
  if(bodyEl && bodyEl.value.trim()) {
    try { body = JSON.parse(bodyEl.value); }
    catch(e) { document.getElementById('tryStatus').textContent = '⚠ JSON 파싱 오류: '+e.message; return; }
  }

  // Preview
  let previewLines = `${ep.method} ${url}\n`;
  Object.entries(headers).forEach(([k,v]) => { previewLines += `${k}: ${k==='X-Api-Key'? v.slice(0,16)+'****':v}\n`; });
  if(body) previewLines += '\n'+JSON.stringify(body, null, 2);
  document.getElementById('reqPreview').textContent = previewLines;

  document.getElementById('tryStatus').textContent = '요청 중...';
  document.getElementById('responseArea').style.display = 'none';

  const t0 = Date.now();
  const opts = { method:ep.method, headers };
  if(body !== undefined) opts.body = JSON.stringify(body);

  fetch(url, opts)
    .then(async r => {
      const elapsed = Date.now() - t0;
      const ct = r.headers.get('content-type') || '';
      const text = await r.text();
      showResponse(r.status, elapsed, text, ct);
      addHistory(ep.method, ep.path, r.status, elapsed);
    })
    .catch(err => {
      showResponse(0, Date.now()-t0, 'Error: '+err.message, 'text/plain');
      addHistory(ep.method, ep.path, 0, 0);
    });
}

function showResponse(status, elapsed, text, ct) {
  const badge = document.getElementById('statusBadge');
  badge.textContent = status || 'ERR';
  badge.className = 'status-badge ' + (status >= 200 && status < 300 ? 'status-2xx' : status >= 400 ? 'status-4xx' : status >= 500 ? 'status-5xx' : 'status-0');
  document.getElementById('responseTime').textContent = elapsed + ' ms';

  let displayText = text;
  if(ct.includes('json')) {
    try { displayText = syntaxHighlight(JSON.stringify(JSON.parse(text), null, 2)); }
    catch(e) { displayText = text; }
  }
  document.getElementById('responseBody').innerHTML = displayText;
  document.getElementById('responseArea').style.display = '';
  document.getElementById('tryStatus').textContent = status >= 200 && status < 300 ? '✓ 성공' : '✗ 오류';
  // store raw for copy
  document.getElementById('responseBody').dataset.raw = text;
}

function clearResponse() {
  document.getElementById('responseArea').style.display = 'none';
  document.getElementById('tryStatus').textContent = '';
  document.getElementById('reqPreview').textContent = 'Execute 버튼을 누르면 여기에 표시됩니다.';
}

function copyResponse() {
  const raw = document.getElementById('responseBody').dataset.raw || '';
  navigator.clipboard.writeText(raw).then(()=>{}).catch(()=>{});
}

// ── Render Code Examples ───────────────────────────────────────────────────────
function renderCode(ep) {
  const panel = document.getElementById('codePanel');
  const base = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '') || 'http://server:8080';
  let urlEx = base + ep.path;
  if(ep.pathParams) {
    ep.pathParams.forEach(p => { urlEx = urlEx.replace('{'+p.name+'}', '<'+p.name+'>'); });
  }

  // curl
  let curlLines = [`curl -s -X ${ep.method} "${urlEx}" \\`];
  curlLines.push('  -H "X-Api-Key: $ROCHE_API_KEY" \\');
  if(ep.body) {
    curlLines.push("  -H \"Content-Type: application/json\" \\");
    curlLines.push(`  -d '${JSON.stringify(ep.body, null, 2)}'`);
  } else {
    curlLines[curlLines.length-1] = curlLines[curlLines.length-1].replace(' \\','');
  }
  const curlCode = curlLines.join('\n');

  // python
  let pyBody = ep.body ? `\npayload = ${JSON.stringify(ep.body, null, 4)}\nresp = requests.${ep.method.toLowerCase()}(url, json=payload, headers=headers)` : `\nresp = requests.${ep.method.toLowerCase()}(url, headers=headers)`;
  const pyCode = `import requests

BASE = "${base}"

// ── History ────────────────────────────────────────────────────────────────────
function addHistory(method, path, status, elapsed) {
  requestHistory.unshift({ method, path, status, elapsed, time: new Date().toLocaleTimeString() });
  if(requestHistory.length > 20) requestHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if(!requestHistory.length) { list.innerHTML = '<div style="padding:16px 12px;color:var(--muted);font-size:.75rem">요청 내역이 없습니다.</div>'; return; }
  const mc = {GET:'var(--green)',POST:'var(--accent)',PUT:'var(--yellow)',DELETE:'var(--red)'};
  list.innerHTML = requestHistory.map(h => `
    <div class="history-item">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="hi-method" style="color:${mc[h.method]||'#fff'}">${h.method}</span>
        <span class="hi-status" style="color:${h.status>=200&&h.status<300?'var(--green)':h.status>=400?'var(--red)':'var(--muted)'}">${h.status||'ERR'}</span>
      </div>
      <div class="hi-path">${h.path}</div>
      <div style="font-size:.65rem;color:var(--muted);margin-top:2px">${h.time} · ${h.elapsed}ms</div>
    </div>`).join('');
}

// ── Auth ───────────────────────────────────────────────────────────────────────
function updateBaseUrl() { /* live update happens on execute */ }
function updateApiKey()  { checkAuth(); }

function checkAuth() {
  const base = document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const key  = document.getElementById('cfgKey').value.trim();
  if(!base || !key) { setAuthStatus(false, ''); return; }
  fetch(base+'/api/auth/me', { headers:{ 'X-Api-Key': key } })
    .then(r=>r.json())
    .then(d=>setAuthStatus(d.authenticated, d.user_id||''))
    .catch(()=>setAuthStatus(false,''));
}

function setAuthStatus(ok, user) {
  document.getElementById('authDot').className = 'auth-dot'+(ok?' ok':'');
  document.getElementById('authLabel').textContent = ok ? `${user} 인증됨` : '미인증';
}

function openLoginModal() {
  const modal = document.getElementById('loginModal');
  modal.style.display = 'flex';
  document.getElementById('loginUser').focus();
}
function closeLoginModal() {
  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('loginErr').style.display = 'none';
}

function doLogin() {
  const base = document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const user = document.getElementById('loginUser').value.trim();
  const pw   = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if(!base||!user||!pw){ errEl.textContent='URL, ID, 비밀번호를 모두 입력하세요.'; errEl.style.display=''; return; }

  fetch(base+'/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id:user, password:pw }), credentials:'include',
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.success){ errEl.textContent = d.error||'로그인 실패'; errEl.style.display=''; return; }
    // get API key
    return fetch(base+'/api/auth/api_key', { credentials:'include' }).then(r=>r.json());
  })
  .then(d=>{
    if(!d || !d.api_key) return;
    document.getElementById('cfgKey').value = d.api_key;
    closeLoginModal();
    checkAuth();
  })
  .catch(e=>{ errEl.textContent='연결 실패: '+e.message; errEl.style.display=''; });
}

// ── Utilities ──────────────────────────────────────────────────────────────────
function syntaxHighlight(json) {
  return escHtml(json).replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    m => {
      if(/^"/.test(m)) return /:$/.test(m) ? `<span class="json-key">${m}</span>` : `<span class="json-str">${m}</span>`;
      if(/true|false/.test(m)) return `<span class="json-bool">${m}</span>`;
      if(/null/.test(m)) return `<span class="json-null">${m}</span>`;
      return `<span class="json-num">${m}</span>`;
    }
  );
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText(btn) {
  const code = btn.closest('.code-block').querySelector('.code-body');
  navigator.clipboard.writeText(code.innerText).then(()=>{
    const orig = btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=orig,1200);
  }).catch(()=>{});
}

function toggleKeyVisibility() {
  const el = document.getElementById('cfgKey');
  el.type = el.type === 'password' ? 'text' : 'password';
}
