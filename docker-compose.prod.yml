# Roche_nxt — production Docker Compose file.
#
# Differences vs. the dev `docker-compose.yml`:
#   * NO bind-mount of ./web_ui or ./       (source code stays inside the image)
#   * NO DEV_MODE override                  (signed license is mandatory)
#   * license/ is mounted read-only         (customers cannot accidentally edit it)
#   * ENABLE_* env fallbacks are removed    (feature flags come only from the license)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# The customer must have placed a valid signed license at
# ./license/license.json (see LICENSE.md for details).
#
# Key directories (configure in .env):
#   HOST_DIR        — Roche_nxt install root (e.g. /opt/roche_nxt)
#   DATA_HOST_DIR   — Reference data root; defaults to HOST_DIR/data
#                     Contains hg38/ with genome, STAR index, GTF, CTAT lib, etc.
#   FASTQ_HOST_DIR  — Where input FASTQ files are placed by the lab
#   BED_HOST_DIR    — BED target files
#   LIFTOVER_HOST_DIR — hg38ToHg19 chain file (for hg19 view feature)

services:
  roche-nxt-web:
    image: roche_nxt_web:latest
    container_name: roche_nxt_web
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-113}"
    ports:
      - "${WEB_PORT:-8080}:5000"
    volumes:
      # Mount the entire install directory as /roche_nxt so all sub-paths
      # (fastq/, data/, results/, work/, log/, etc.) resolve correctly inside
      # the container — mirrors the dev setup without the source-code override.
      - ${HOST_DIR:-/opt/roche_nxt}:/roche_nxt
      # Input sources (read-only, accessible via /fastq_source and /bed_source)
      - ${FASTQ_HOST_DIR:-./fastq}:/fastq_source:ro
      - ${BED_HOST_DIR:-./bed}:/bed_source:ro
      - ${LIFTOVER_HOST_DIR:-./liftover}:/liftover:ro
      # Docker socket — allows spawning sibling analysis containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    read_only: false      # pipeline writes to log/work/results
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Seoul}
      - ROCHE_NXT_DIR=/roche_nxt
      # HOST_DIR must be the HOST-side path (not the container path).
      # The web container uses it to construct docker run -v arguments
      # for sibling analysis containers.
      - HOST_DIR=${HOST_DIR:-/opt/roche_nxt}
      # DATA_HOST_DIR: host-side path to reference data root.
      # Defaults to HOST_DIR/data. Override if refs live on a separate disk.
      - DATA_HOST_DIR=${DATA_HOST_DIR:-}
      - ANALYSIS_IMAGE=roche_nxt_analysis:latest
      - FASTQ_HOST_DIR=${FASTQ_HOST_DIR:-}
      - BED_HOST_DIR=${BED_HOST_DIR:-}
      - LIFTOVER_CHAIN_HG38_TO_HG19=${LIFTOVER_CHAIN_HG38_TO_HG19:-/liftover/hg38ToHg19.over.chain.gz}
      - LICENSE_PATH=/roche_nxt/license/license.json
      - MAX_CPUS=${MAX_CPUS:-0}
      - MAX_MEMORY=${MAX_MEMORY:-0}
      - MAX_CONCURRENT_SAMPLES=${MAX_CONCURRENT_SAMPLES:-0}
      # NOTE: DEV_MODE and ENABLE_* are intentionally absent. Do not add them.
